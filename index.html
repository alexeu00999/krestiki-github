<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12131a" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./style.css" />
    <title>Крестики-нолики</title>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Крестики-нолики</h1>
        <button id="theme-toggle" class="button button--ghost" type="button" aria-label="Переключить тему">
          Тема
        </button>
      </header>

      <section class="panel" aria-label="Настройки игры">
        <label for="mode-select">Режим:</label>
        <select id="mode-select" class="select" aria-label="Выбор режима">
          <option value="pvp">Игрок vs Игрок</option>
          <option value="pve">Игрок vs Бот</option>
        </select>
        <button id="restart" class="button" type="button">Новая игра</button>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section class="board" aria-label="Игровое поле">
        <button class="cell" data-index="0" aria-label="Клетка 1"></button>
        <button class="cell" data-index="1" aria-label="Клетка 2"></button>
        <button class="cell" data-index="2" aria-label="Клетка 3"></button>
        <button class="cell" data-index="3" aria-label="Клетка 4"></button>
        <button class="cell" data-index="4" aria-label="Клетка 5"></button>
        <button class="cell" data-index="5" aria-label="Клетка 6"></button>
        <button class="cell" data-index="6" aria-label="Клетка 7"></button>
        <button class="cell" data-index="7" aria-label="Клетка 8"></button>
        <button class="cell" data-index="8" aria-label="Клетка 9"></button>
      </section>

      <section class="stats" aria-label="Статистика">
        <h2>Статистика</h2>
        <dl>
          <div><dt>X</dt><dd id="stat-x">0</dd></div>
          <div><dt>O</dt><dd id="stat-o">0</dd></div>
          <div><dt>Ничьи</dt><dd id="stat-draw">0</dd></div>
        </dl>
        <button id="reset-stats" class="button button--ghost" type="button">Сбросить статистику</button>
      </section>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
